version: 2
updates:
  # bun.lock is not committed, so Dependabot updates package.json through the npm ecosystem.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Dependency"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Dependency"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
